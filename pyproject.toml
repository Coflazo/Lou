[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lou-cli"
version = "0.1.0"
description = "Command-line client for the Lou legal workspace"
requires-python = ">=3.11"

[project.scripts]
lou = "cli.lou:main"

[tool.setuptools.packages.find]
include = ["cli*"]
